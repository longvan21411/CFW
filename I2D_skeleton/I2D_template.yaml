apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  namespace: default
  annotations:
    backstage.io/managed-by-location: url:https://github.com/longvan21411/CFW/edit/upload_template/I2D_skeleton/I2D_template.yaml
    backstage.io/managed-by-origin-location: url:https://github.com/longvan21411/CFW/edit/upload_template/I2D_skeleton/I2D_template.yaml
    backstage.io/view-url: https://github.com/longvan21411/CFW/edit/upload_template/I2D_skeleton/I2D_template.yaml
    backstage.io/edit-url: https://github.com/longvan21411/CFW/edit/upload_template/I2D_skeleton/I2D_template.yaml
    backstage.io/source-location: url:https://github.com/longvan21411/CFW/edit/upload_template/I2D_skeleton/
  name: tvv2hc-i2d-agent-sdk-template
  title: Agent Orbit - I2D Agent SDK Template - TVV2HC
  description: >-
    A unified Python meta-wrapper that lets any team build AI agents
    using a clean, standardized interface — regardless of which backend
    (LangGraph, AutoGen, OpenAI Agents SDK, Claude SDK) is running underneath.
  tags:
    - v1
    - i2d-agent-sdk

spec:
  owner: group:default/idm2bcd_cfw_admin_internal
  type: service
  isLatestVersion: "true"
  displayInBrownFieldTemplate: "true"
  parameters:
    - title: Fill in some steps
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          default: github.boschdevcloud.com?        
        repoOwner:
          title: Repository Owner
          type: string
          default: cfw-pmt-testorg
        repoName:
          title: Repository name
          type: string
          default: tvv2hc-test-0001
    - title: Remote Development Environment Information
      required:
        - coderToken
        - serverURL
        - templateName
      properties:
        templateName:
          title: Coder Template Name
          type: string
          default: i2d-bsw-development-template
  steps:
    # - id: fetch-base
    #   name: Fetch Template Structure
    #   action: fetch:template
    #   input:
    #     url: https://github.boschdevcloud.com/ETH-Incubation/i2d-agent-sdk
    #     cookiecutterCompat: true
    #     values:
    #       repository_name: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
    #       projectSlug: ${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}
    #       template_name: i2d-agent-sdk-template
    #       template_title: I2D Agent SDK Template
    #       frameUrl: ${{ environment.parameters.baseUrl }}
    #       selected_group: group:default/idm2bcd_cfw_admin_internal
   
    - id: render-catalog
      name: Render Catalog Descriptor
      action: fetch:template:file
      input:
        url: ./Catalog.yaml
        targetPath: Catalog.yaml
        cookiecutterCompat: true
        replace: true
        values:
          repository_name: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          description: I2D Agent SDK application generated from Backstage
          projectSlug: ${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}
          template_name: i2d-agent-sdk-template
          template_title: I2D Agent SDK Template
          frameUrl: ${{ environment.parameters.baseUrl }}
          selected_group: group:default/idm2bcd_cfw_admin_internal
          serverURL: ${{ parameters.serverURL }}          
    
    - id: publish
      name: Create New Repository
      action: publish:github
      input:        
        description: This is test repository ${{ (parameters.repoUrl | parseRepoUrl).repo }}
        repoUrl: github.boschdevcloud.com?owner=${{ parameters.repoOwner }}&repo=${{ parameters.repoName }}
        defaultBranch: main       
        collaborators:
          - user: WED3KOR
            access: read
    
    - id: register
      name: Register to Common Frameworks
      action: catalog:register
      input:       
        catalogInfoUrl: https://${{ (parameters.repoUrl | parseRepoUrl).host }}/${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}/blob/main/Catalog.yaml
  output:    
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
     
